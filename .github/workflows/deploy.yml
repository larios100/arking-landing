name: Deploy Landing

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to IIS
        shell: powershell
        run: |
          robocopy "dist" "C:\inetpub\wwwroot\Arking.Landing" /MIR /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit 1 } else { exit 0 }
